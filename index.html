<!DOCTYPE html>
<html lang="su"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumora: Ngariksa Tradisi</title>
<style>
:root{--page:#e8f1ff;--txt:#0b1630;--pn:#122349;--pt:#eaf6ff;--ac:#5fd4ff;--ok:#3ddc97;--no:#ff6b81;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#070e20;--txt:#eaf6ff}}
:root[data-theme="dark"]{--page:#070e20;--txt:#eaf6ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#w{max-width:820px;margin:0 auto;padding:8px}
h1{font-size:18px;margin:4px 0}
#h{display:flex;justify-content:space-between;font-weight:600;padding:6px 10px;background:var(--pn);color:var(--pt);border-radius:10px 10px 0 0;font-size:15px}
#s{position:relative}
canvas{width:100%;display:block;background:#0b1630;touch-action:none}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(7,14,32,.82);padding:12px}
.ov.on{display:flex}
.box{background:var(--pn);color:var(--pt);border:2px solid var(--ac);border-radius:14px;padding:16px;max-width:560px;width:100%;box-shadow:0 0 24px rgba(95,212,255,.4);text-align:center}
.box h2{margin:0 0 8px;font-size:20px;color:var(--ac)}
.box p{margin:6px 0;line-height:1.45;font-size:15px}
.tx{font-style:italic;background:rgba(255,255,255,.08);border-radius:8px;padding:8px}
button{font:inherit;cursor:pointer}
.o{display:block;width:100%;margin:6px 0;padding:10px;border-radius:10px;border:2px solid var(--ac);background:transparent;color:var(--pt);font-weight:600}
.o:hover:enabled{background:rgba(95,212,255,.2)}
.o:disabled{opacity:.45;border-color:var(--no);cursor:not-allowed}
.o.ok{background:var(--ok);border-color:var(--ok);color:#06241a;opacity:1}
#fb{min-height:22px;font-weight:600}
.go{background:var(--ac);color:#06203a;border:0;border-radius:10px;padding:10px 22px;font-weight:700;margin-top:8px}
#t{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
#t button{flex:1;padding:14px;border-radius:12px;border:0;background:var(--pn);color:var(--pt);font-size:20px;user-select:none;touch-action:none}
#t button:active{background:var(--ac);color:#06203a}
small{opacity:.8;display:block;margin-top:4px}
#sp{position:fixed;inset:0;z-index:50;background:#050b22;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:8px 12px;transition:opacity .5s}
#sp.off{opacity:0;pointer-events:none}
#sp img{max-width:100%;max-height:calc(100dvh - 90px);aspect-ratio:1;object-fit:contain;border-radius:14px;box-shadow:0 0 40px rgba(95,212,255,.35)}
#sp .go{animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 0 22px var(--ac)}}
</style></head>

{n:'Struktur Tradisi',t:'Hiji tradisi biasana diwangun ku tilu bagian pikeun ngaruntuykeun acara ti mimiti nepi ka tungtung.',q:'Susunan struktur tradisi nu bener?',o:['Panutup – Eusi – Bubuka','Eusi – Bubuka – Panutup','Bubuka – Eusi – Panutup'],a:2,f:'Hébat! Bubuka, eusi, panutup. Anjeun parantos ngariksa tradisi!'}
];
const S=[
{g:[[0,1800]],p:[[350,320,120],[600,250,120],[1000,310,120]],c:1450},
{g:[[0,600],[760,1800]],p:[[400,300,100],[900,300,120],[1150,230,120]],c:1500},
{g:[[0,500],[680,1000],[1180,1800]],p:[[540,320,90],[1050,330,90],[1300,280,120]],c:1550},
{g:[[0,450],[620,900],[1080,1300],[1470,1800]],p:[[480,330,90],[700,240,100],[950,320,90],[1330,320,90]],c:1600},
{g:[[0,400],[560,800],[980,1200],[1380,1800]],p:[[430,330,90],[600,230,100],[850,320,90],[1000,240,100],[1250,320,90]],c:1600}];
let st=0,hp=3,sc=0,ss=0,paused=true,cp=null,cam=0,mood=0,moodT=0,orbs=[],R=[],t=0,qOn=0;
const k={l:0,r:0,j:0},p={x:40,y:300,w:24,h:34,vx:0,vy:0,on:false,f:1};
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function hud(){$('#h').innerHTML=`<span>Tahap ${st+1}/5</span><span>Skor ${sc}</span><span>${'❤'.repeat(hp)}${'♡'.repeat(3-hp)}</span>`}
function load(i){st=i;const s=S[i];R=s.g.map(g=>({x:g[0],y:400,w:g[1]-g[0],h:60})).concat(s.p.map(a=>({x:a[0],y:a[1],w:a[2],h:16})));orbs=s.p.map(a=>({x:a[0]+a[2]/2-8,y:a[1]-30,w:16,h:16}));cp={x:s.c,y:250,w:40,h:150};respawn();ss=sc;paused=false;qOn=0;hud()}
function respawn(){p.x=40;p.y=300;p.vx=p.vy=0}
function menu(t,m,b){$('#mt').textContent=t;$('#mp').textContent=m;$('#mb').textContent=b;$('#m').classList.add('on')}
function hurt(){hp--;mood=2;moodT=70;hud();if(hp<=0){paused=true;qOn=0;$('#q').classList.remove('on');menu('Nyawa béak','Tong hanjelu! Pelajari deui struktur tradisi, tuluy cobaan deui tahap ieu.','Cobaan deui');return 1}}
$('#mb').onclick=()=>{$('#m').classList.remove('on');if(hp<=0){hp=3;sc=ss}load(st)};
function openQuiz(){qOn=1;paused=true;const d=Q[st];$('#qn').textContent='Kotak Kuis: '+d.n;$('#qt').textContent='“'+d.t+'”';$('#qq').textContent=d.q;$('#fb').textContent='';
const o=d.o.map((v,i)=>({v,ok:i===d.a})).sort(()=>Math.random()-.5),box=$('#qo');box.innerHTML='';
o.forEach(e=>{const b=document.createElement('button');b.className='o';b.textContent=e.v;b.onclick=()=>ans(b,e.ok,d);box.appendChild(b)});$('#q').classList.add('on')}
function ans(b,ok,d){if(!qOn)return;
if(ok){qOn=0;sc+=100;mood=1;moodT=120;hud();b.classList.add('ok');document.querySelectorAll('.o').forEach(e=>e.disabled=true);b.disabled=false;$('#fb').textContent=d.f;
setTimeout(()=>{$('#q').classList.remove('on');cp=null;paused=false},1500)}
else{b.disabled=true;if(!hurt())$('#fb').textContent='Cobaan deui! Émut-émut deui ngeunaan struktur tradisi.'}}
function step(){t++;if(moodT>0&&--moodT===0)mood=0;if(paused)return;
p.vx=(k.r-k.l)*4.5;if(p.vx)p.f=p.vx>0?1:-1;if(k.j&&p.on){p.vy=-12;p.on=false}
p.vy+=.6;p.x+=p.vx;p.x=Math.max(0,Math.min(W-p.w,p.x));
for(const r of R)if(ov(p,r)){if(p.vx>0)p.x=r.x-p.w;else if(p.vx<0)p.x=r.x+r.w}
p.y+=p.vy;p.on=false;
for(const r of R)if(ov(p,r)){if(p.vy>0){p.y=r.y-p.h;p.on=true}else p.y=r.y+r.h;p.vy=0}
if(p.y>520){if(!hurt())respawn();return}
orbs=orbs.filter(o=>{if(ov(p,o)){sc+=10;hud();return false}return true});
if(cp&&ov(p,cp)){openQuiz();return}
if(!cp&&p.x>W-90){if(st<4){load(st+1)}else{paused=true;ss=0;menu('Sampurasun! Tamat','Anjeun parantos ngariksa tradisi Sunda. Skor akhir: '+sc,'Maén deui');hp=3;sc=0;st=0}}
cam=Math.max(0,Math.min(W-800,p.x-300))}
function draw(){const g=x.createLinearGradient(0,0,0,450);g.addColorStop(0,'#050b22');g.addColorStop(1,'#12306a');x.fillStyle=g;x.fillRect(0,0,800,450);
x.fillStyle='#fff';for(let i=0;i<50;i++){x.globalAlpha=.4+.4*Math.sin(t/30+i);x.fillRect((i*97+(-cam*.1))%800+(i*97%800<0?800:0),(i*53)%260,2,2)}x.globalAlpha=1;
for(let i=0;i<14;i++){const mx=i*180-cam*.5+60,my=400;x.fillStyle='#1d5fd1';x.shadowColor='#5fd4ff';x.shadowBlur=18;x.beginPath();x.ellipse(mx,my-20-(i%3)*10,30+(i%3)*8,24+(i%3)*6,0,Math.PI,0);x.fill();x.fillRect(mx-6,my-22,12,24)}x.shadowBlur=0;
x.save();x.translate(-cam,0);
for(const r of R){x.fillStyle=r.h>20?'#143a3a':'#2c4f9e';x.fillRect(r.x,r.y,r.w,r.h);x.fillStyle=r.h>20?'#3ddc97':'#5fd4ff';x.fillRect(r.x,r.y,r.w,5)}
x.fillStyle='#ffd66b';for(const o of orbs){x.shadowColor='#ffd66b';x.shadowBlur=12;x.beginPath();x.arc(o.x+8,o.y+8+Math.sin(t/12+o.x)*3,7,0,7);x.fill()}x.shadowBlur=0;
if(cp){x.shadowColor='#5fd4ff';x.shadowBlur=20;x.fillStyle='rgba(95,212,255,.35)';x.fillRect(cp.x,cp.y,cp.w,cp.h);x.strokeStyle='#5fd4ff';x.lineWidth=3;x.strokeRect(cp.x,cp.y,cp.w,cp.h);x.shadowBlur=0;x.fillStyle='#fff';x.font='bold 28px sans-serif';x.textAlign='center';x.fillText('?',cp.x+20,cp.y+80)}
x.fillStyle=cp?'#555':'#ffd66b';x.fillRect(W-60,300,5,100);x.fillRect(W-55,300,34,22);
x.fillStyle='#4aa3ff';x.fillRect(p.x,p.y+12,p.w,p.h-12);x.fillStyle='#fff';x.fillRect(p.x,p.y+22,p.w,6);x.fillStyle='#f1c9a5';x.beginPath();x.arc(p.x+12,p.y+8,9,0,7);x.fill();x.fillStyle='#0b1630';x.fillRect(p.x+(p.f>0?14:6),p.y+6,3,3);
const lx=p.x-p.f*26,ly=p.y-8+Math.sin(t/10)*5+(mood===1?-Math.abs(Math.sin(t/6))*10:0);
const col=mood===2?'#7a8cff':mood===1?'#ffe27a':'#aef0ff';x.shadowColor=col;x.shadowBlur=22;x.fillStyle=col;x.beginPath();x.arc(lx+12,ly,9,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#0b1630';x.fillRect(lx+8,ly-2,2,2);x.fillRect(lx+14,ly-2,2,2);
x.restore()}
(function loop(){step();draw();requestAnimationFrame(loop)})();
const key=(e,v)=>{const c=e.code;if(c==='ArrowLeft'||c==='KeyA')k.l=v;if(c==='ArrowRight'||c==='KeyD')k.r=v;if(c==='Space'||c==='ArrowUp'||c==='KeyW'){k.j=v;if(!qOn)e.preventDefault()}};
addEventListener('keydown',e=>key(e,1));addEventListener('keyup',e=>key(e,0));
[['#bl','l'],['#br','r'],['#bj','j']].forEach(([s,n])=>{const b=$(s);b.onpointerdown=e=>{e.preventDefault();k[n]=1};['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,()=>k[n]=0))});
$('#sb').onclick=()=>{$('#sp').classList.add('off');setTimeout(()=>$('#sp').remove(),600)};
addEventListener('keydown',e=>{if(e.code==='Enter'&&$('#sp'))$('#sb').click()});
hud();
</script></body></html>
